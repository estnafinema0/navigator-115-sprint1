# Таймеры M4: законные сроки. Дата считается кодом по производственному календарю (kb/calendar/),
# не LLM. У каждого таймера — норма, точка отсчёта, тип дней, первоисточник в kb/sources/ и дословная
# цитата (quote). verified: true — формулировка сверена с файлом первоисточника.
# Редакции: 115-ФЗ и 161-ФЗ — ИПС «Законодательство России», редакция от 04.08.2026 № 283-ФЗ
# (kb/sources/laws/*); 842-П — с изменениями 7382-У. Сверка — 21.10.2026.

version: "0.2.0"
edition_checked: "2026-10-21"

timers:
  refusal_notice_5wd:
    title: "Банк сообщает дату и причины отказа"
    applies_to: [operation_refusal, contract_refusal, contract_termination]
    amount: 5
    unit: working_days
    anchor: "день принятия банком решения"
    norm: "115-ФЗ ст. 7 п. 13.1-1 (абз. 1: отказ от договора и расторжение; абз. 2: отказ в операции по п. 11)"
    who: bank
    source: {doc: fz_115, file: laws/fz-115_ips-rdk151.txt}
    quote: "в срок не позднее пяти рабочих дней со дня принятия решения об отказе от проведения операции"
    verified: true
  bank_review_7wd:
    title: "Банк рассматривает документы клиента об отсутствии оснований для отказа"
    applies_to: [operation_refusal, contract_refusal]
    amount: 7
    unit: working_days
    anchor: "день представления документов клиентом (счёт со следующего дня, ст. 191 ГК РФ)"
    norm: "115-ФЗ ст. 7 п. 13.4"
    who: bank
    source: {doc: fz_115, file: laws/fz-115_ips-rdk151.txt}
    quote: "обязана рассмотреть представленные клиентом документы и (или) сведения и в срок не позднее семи рабочих дней со дня их представления сообщить клиенту"
    verified: true
  cbr_review_15wd:
    title: "Банк России рассматривает заявление о пересмотре высокого уровня риска (ЗСК)"
    applies_to: [zsk_high_cbr_only]
    amount: 15
    unit: working_days
    anchor: "день получения Банком России заявления"
    norm: "115-ФЗ ст. 7.8 п. 1.1"
    who: cbr
    source: {doc: fz_115, file: laws/fz-115_ips-rdk151.txt}
    quote: "в срок не позднее пятнадцати рабочих дней со дня получения Центральным банком Российской Федерации заявления о пересмотре высокой степени (уровня) риска"
    verified: true
  cbr_161_review_15wd:
    title: "Банк России рассматривает заявление об исключении сведений из базы данных (161-ФЗ)"
    applies_to: [fz161_restriction]
    amount: 15
    unit: working_days
    anchor: "день поступления заявления в Банк России"
    norm: "Указание Банка России 6748-У (в ред. 7287-У)"
    who: cbr
    source: {doc: cbr_6748u, file: cbr/cbr-6748-U_2024-06-13.txt}
    quote: null   # срок взят из методички ЦБ (с. 7 PDF); формулировку в 6748-У сверить по тексту — скан с OCR
    verified: false
  mvk_review_20wd:
    title: "МВК рассматривает заявление и документы"
    applies_to: [operation_refusal, contract_refusal, zsk_measures_7_7, zsk_high_cbr_only]
    amount: 20
    unit: working_days
    anchor: "день поступления заявления"
    extra_notice_wd: 3
    norm: "срок рассмотрения: методичка ЦБ (с. 21 PDF, схема 1); сообщение о решении: Положение 842-П, п. 4.1 (3 р. д.)"
    who: mvk
    source: {doc: cbr_mrp_guide, file: cbr/cbr-mrp-guide_2025-10-23.txt, page: 21}
    quote: "в срок, не превышающий 20 рабочих дней"
    note: "В тексте 115-ФЗ и 842-П прямой нормы о 20 р. д. на решение МВК не найдено; в 842-П 20 р. д. это срок ответа об оставлении заявления без рассмотрения. Показываем клиенту как ориентир ЦБ, не как законный срок."
    verified: true
  mvk_7_7_window_6m:
    title: "Окно подачи в МВК при мерах п. 5 ст. 7.7 (после него сведения уходят в ФНС для исключения из ЕГРИП/ЕГРЮЛ)"
    applies_to: [zsk_measures_7_7]
    amount: 6
    unit: months
    anchor: "день получения уведомления банка о применении мер (п. 8 ст. 7.7); срок течёт со следующего дня"
    norm: "115-ФЗ ст. 7.8 п. 1"
    who: client
    source: {doc: fz_115, file: laws/fz-115_ips-rdk151.txt}
    quote: "Заявление об отсутствии оснований может быть направлено в межведомственную комиссию в течение шести месяцев со дня, следующего за днем получения заявителем информации"
    consequence: "Методичка ЦБ, с. 28 PDF: сведения в ФНС «не позднее 10 рабочих дней после истечения 6-месячного срока»"
    verified: true
  termination_60d:
    title: "Расторжение договора банковского счёта по инициативе банка"
    applies_to: [contract_termination]
    amount: 60
    unit: calendar_days
    anchor: "день направления банком уведомления о расторжении"
    norm: "ГК РФ ст. 859 п. 3 (текст ГК в kb/sources ещё не сохранён)"
    who: bank
    source: null
    quote: null
    verified: false
  fz161_confirm_next_day:
    title: "Подтвердить приостановленный перевод"
    applies_to: [fz161_transfer_suspension]
    amount: 1
    unit: calendar_days
    anchor: "день приостановления приёма распоряжения к исполнению"
    norm: "161-ФЗ ст. 8 ч. 3.6 п. 3"
    who: client
    source: {doc: fz_161, file: laws/fz-161_ips-rdk61.txt}
    quote: "о возможности клиента подтвердить распоряжение не позднее одного дня, следующего за днем приостановления"
    verified: true
  fz161_suspension_2d:
    title: "Срок приостановления перевода банком"
    applies_to: [fz161_transfer_suspension]
    amount: 2
    unit: calendar_days
    anchor: "день приостановления"
    norm: "161-ФЗ ст. 8 ч. 3.4"
    who: bank
    source: {doc: fz_161, file: laws/fz-161_ips-rdk61.txt}
    quote: "приостанавливает прием к исполнению распоряжения клиента на два дня"
    verified: true

# Для чистого запроса документов законного срока ответа клиента нет — срок задаёт банк
# по договору и внутренним правилам (методичка ЦБ, с. 15 PDF). Карточка показывает срок из текста запроса.
no_statutory_client_deadline: [doc_request]
