  bytes: 1150214
  edition_note: 'ИПС, редакция № 192 «от 15.05.2026 № 32-П (изм.)». Не включены («не готова»): 37-ФЗ, 90-ФЗ, 91-ФЗ, 108-ФЗ, 144-ФЗ, 246-ФЗ (2026). По официальным текстам 90-ФЗ (ст. 128, 186¹), 144-ФЗ (ст. 59, 81, 93, 99, 125, 152, 185¹, 329¹), 246-ФЗ (ст. 57–59, 351⁸, 351⁹) ст. 95 и 112 не затрагиваются; 37-ФЗ, 91-ФЗ, 108-ФЗ — по названиям (ст. 341², 70, 179). Вывод: ст. 95 и 112 в выписке актуальны на 21.10.2026.'
