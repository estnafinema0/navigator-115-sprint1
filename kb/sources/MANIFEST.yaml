  notes: 'Сверка 2027: нерабочие будни и рабочая суббота 20.02 совпадают с ПП № 1187 + ст. 112 ТК. Утверждение ресерча проверено: 22.02 — нерабочий (ПП № 1187, перенос с сб 20.02); 03.05 и 10.05 — нерабочие (автоматический перенос с сб 01.05 и вс 09.05 по ч. 2 ст. 112 ТК, НЕ постановлением); 20.02 — рабочая суббота (ПП № 1187). «20.02 сокращённый» — только по xmlcalendar (t=2): постановление о сокращении не говорит, а буквально по ч. 1 ст. 95 ТК 20.02 не «непосредственно предшествует» празднику 23.02 (между ними вс 21.02 и выходной 22.02); подтвердить у Минтруда не удалось (mintrud.gov.ru — капча). Для подсчёта рабочих дней это не важно: сокращённый день остаётся рабочим. Также 14.06 (перенос с сб 12.06) и 05.11, 31.12 (ПП № 1187) — нерабочие.'
